name: watch
on:
  schedule:
    - cron: "*/10 * * * *"  # GitHub may start scheduled runs late under load; the Worker dedupes, so late is fine
  workflow_dispatch:
permissions:
  contents: write  # only for the keepalive commit below
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python runner.py
        env:
          RW_INGEST_KEY: ${{ secrets.RW_INGEST_KEY }}
      - name: Keep the schedule alive
        # GitHub disables scheduled workflows in a public repo after 60 days with no commits
        if: always()
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt 4320000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
